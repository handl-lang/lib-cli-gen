# git SDK spec — CORRECTED BASELINE (hand-authored)
# `git --help` groups commands under prose section headers the
# probe cannot parse (24 rows dropped -> empty tree). Commands taken
# from `git help -a` filtered to runnable builtins+installed helpers;
# every leaf carries `rest: args` so unmodelled flags/subcommands
# still pass through. Curated `options:` on the high-traffic set.
name: git
about: the stupid content tracker
commands:
  add:
    about: "Add file contents to the index"
    options:
      all:
        flag: --all
        kind: flag
        doc: "stage modified and deleted files (-A)"
      update:
        flag: --update
        kind: flag
        doc: "stage tracked modifications only (-u)"
      patch:
        flag: --patch
        kind: flag
        doc: "interactively choose hunks (-p)"
      verbose:
        flag: --verbose
        kind: flag
        doc: "be verbose (-v)"
      force:
        flag: --force
        kind: flag
        doc: "allow adding otherwise-ignored files (-f)"
    rest:
      name: args
      kind: string
      doc: "extra argv passed through verbatim"
